stages:
  - build
  - deploy

variables:
  GIT_DEPTH: "1"

get_lflist:
  stage: build
  script:
    - apt update;apt -y install wget sqlite3
    - wget -O lflist.conf https://code.mycard.moe/mycard/ygopro/-/raw/master/lflist.conf
    - ls locales | xargs -I {} bash -c 'cp ./lflist.conf ./locales/{}/ ; sqlite3 ./locales/{}/cards.cdb .dump > ./locales/{}/cards.sql'
    - cp -rf locales dist
  artifacts:
    paths:
      - dist/
  tags:
    - linux

upload_to_minio_latest:
  stage: deploy
  dependencies:
    - get_lflist
  tags: 
    - linux
  script:
    - aws s3 --endpoint=https://minio.mycard.moe:9000 sync --delete dist/ s3://mycard/ygopro-database
  only:
    - master

# This commit as a card-set release of the rolling stage (ygopro-deploy
# DESIGN.md section 11): the deployer fetches it (of it what .cardset says:
# locales/zh-CN), tries it on the smoke rooms of the stage's live colour,
# then new rooms take it; running rooms keep theirs and no server is
# replaced. No secret: GitLab's ID token names this project and commit, and
# the job's token (a header) is for the fetch. DEPLOYER_URL and DEPLOYER_PIN
# (its TLS key pin): CI/CD variables, not secret; until both are set the job
# is not created.
release-rolling:
  stage: deploy
  needs: []
  tags:
    - docker
  image: curlimages/curl:8.11.1
  before_script: []
  environment:
    name: rolling
  id_tokens:
    DEPLOY_TOKEN:
      aud: https://ygopro-deploy.moenext.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $DEPLOYER_URL && $DEPLOYER_PIN'
  script:
    # -k skips the CA check only; --pinnedpubkey still refuses any other key.
    - >-
      curl -sS -k --pinnedpubkey "$DEPLOYER_PIN" --fail-with-body --max-time 1800
      -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" -H "X-Ygopro-Deploy-Job-Token: $CI_JOB_TOKEN"
      "$DEPLOYER_URL"

